[package]
name = "paperwhite-desktop-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "High-contrast E-ink dashboard server for Kindle Paperwhite PC and NAS monitoring"

[dependencies]
axum = "0.8.9"
base64 = "0.22"
chrono = { version = "0.4.45", features = ["serde"] }
hmac = "0.12"
local-ip-address = "0.6.13"
nvml-wrapper = "0.13.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sysinfo = "0.39.6"
tokio = { version = "1.54.1", features = ["full", "macros"] }
