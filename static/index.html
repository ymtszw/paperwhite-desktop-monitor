<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kindle Desktop Monitor</title>
  <style>
    /* ========================================================
       E-ink Minimalist 3x2 Bold Dashboard (Legacy WebKit Strict)
       ======================================================== */
    * {
      -webkit-box-sizing: border-box;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    ::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      touch-action: none;
    }

    body {
      margin: 0 !important;
      padding: 0 !important;
      width: 104% !important;
      height: 100% !important;
      overflow: hidden !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      touch-action: none;
      background-color: #ffffff;
      color: #000000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    /* Outer Viewport Stage to completely prevent WebKit scroll overflow */
    #viewport-stage {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
      background-color: #ffffff;
    }

    /* Rotator Wrapper */
    #screen-rotator {
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      overflow: hidden !important;
      background-color: #ffffff;
      box-sizing: border-box;
    }

    /* 3 Columns x 2 Rows Bold Table Layout */
    #tiles-table {
      width: 100%;
      height: 100%;
      table-layout: fixed;
      border-collapse: separate;
      border-spacing: 8px;
      padding: 4px;
      box-sizing: border-box;
    }

    .tile-cell {
      width: 33.333%;
      height: 50%;
      padding: 0;
      margin: 0;
      vertical-align: top;
    }

    /* Graphical Bold Tile Box */
    .tile-box {
      width: 100%;
      height: 100%;
      border: 4px solid #000000;
      background-color: #ffffff;
      padding: 10px 14px;
      box-sizing: border-box;
      display: -webkit-box;
      display: flex;
      -webkit-box-orient: vertical;
      -webkit-flex-direction: column;
      flex-direction: column;
      -webkit-box-pack: justify;
      justify-content: space-between;
      overflow: hidden;
    }

    /* Tile Header */
    .tile-top {
      display: table;
      width: 100%;
      border-bottom: 3px solid #000000;
      padding-bottom: 6px;
      margin-bottom: 6px;
    }

    .tile-title {
      display: table-cell;
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 1px;
      vertical-align: middle;
      text-align: left;
    }

    .tile-tag {
      display: table-cell;
      font-size: 1.05rem;
      font-weight: 800;
      vertical-align: middle;
      text-align: right;
    }

    .tile-badge {
      display: inline-block;
      border: 2px solid #000000;
      padding: 1px 6px;
      border-radius: 3px;
      font-family: monospace;
      font-weight: 900;
    }

    /* Large Center Metric */
    .tile-mid {
      margin: 4px 0;
      display: -webkit-box;
      display: flex;
      -webkit-box-align: baseline;
      align-items: baseline;
      -webkit-box-pack: justify;
      justify-content: space-between;
    }

    .tile-num-wrap {
      display: inline-block;
      line-height: 1;
    }

    .tile-num {
      font-size: 4.2rem;
      font-weight: 900;
      line-height: 1;
      font-family: "Courier New", Courier, monospace, sans-serif;
    }

    .tile-pct {
      font-size: 2.2rem;
      font-weight: 900;
      margin-left: 2px;
    }

    .tile-sub-stat {
      font-size: 1.15rem;
      font-weight: 800;
      text-align: right;
      line-height: 1.3;
    }

    /* Graphical History Sparkline Chart (20 vertical columns) */
    .hist-container {
      width: 100%;
      height: 140px;
      border-top: 3px solid #000000;
      padding-top: 8px;
      box-sizing: border-box;
      display: table;
      table-layout: fixed;
    }

    .hist-col {
      display: table-cell;
      height: 100%;
      vertical-align: bottom;
      padding: 0 2px;
      box-sizing: border-box;
    }

    .hist-bar {
      width: 100%;
      background-color: #000000;
      min-height: 3px;
      height: 3px;
    }

    /* Multi-Disk Storage Rows */
    .disk-row {
      margin-bottom: 8px;
    }

    .disk-header {
      display: table;
      width: 100%;
      margin-bottom: 3px;
    }

    .disk-name {
      display: table-cell;
      font-size: 1.3rem;
      font-weight: 900;
      font-family: monospace;
      text-align: left;
    }

    .disk-meta {
      display: table-cell;
      font-size: 1.1rem;
      font-weight: 800;
      text-align: right;
    }

    .disk-track {
      width: 100%;
      height: 20px;
      border: 3px solid #000000;
      background-color: #ffffff;
      box-sizing: border-box;
    }

    .disk-fill {
      height: 100%;
      background-color: #000000;
    }

    /* Action Tile for Rotation & Status */
    .tile-action {
      cursor: pointer;
      text-align: center;
      -webkit-box-align: center;
      align-items: center;
      -webkit-box-pack: center;
      justify-content: center;
    }

    .tile-action:active {
      background-color: #000000;
      color: #ffffff;
    }

    .tile-action:active .tile-action-icon,
    .tile-action:active .tile-action-label,
    .tile-action:active .tile-action-sub,
    .tile-action:active .adj-btn {
      color: #ffffff;
      border-color: #ffffff;
    }

    .tile-action-icon {
      font-size: 4.5rem;
      font-weight: 900;
      line-height: 1;
      margin: 8px 0;
    }

    .tile-action-label {
      font-size: 1.6rem;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .tile-action-sub {
      font-size: 1.1rem;
      font-weight: 800;
      margin-top: 6px;
    }

    /* Utility Button */
    .adj-btn {
      background: #ffffff;
      color: #000000;
      border: 2px solid #000000;
      font-weight: 900;
      font-size: 0.9rem;
      padding: 3px 8px;
      border-radius: 3px;
      cursor: pointer;
      display: inline-block;
      margin-top: 8px;
    }

    .adj-btn:active {
      background: #000000;
      color: #ffffff;
    }

    /* ========================================================
       PC Sleep Overlay
       ======================================================== */
    #sleep-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      z-index: 9999;
      padding: 16px;
      box-sizing: border-box;
      text-align: center;
    }

    .sleep-icon {
      font-size: 3.5rem;
      line-height: 1;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .sleep-box {
      border: 5px solid #000000;
      padding: 24px 28px;
      max-width: 500px;
      margin: 60px auto 0 auto;
      background-color: #ffffff;
      text-align: center;
    }

    .sleep-title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .sleep-sub {
      font-size: 1.15rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .sleep-details {
      border-top: 3px dashed #000000;
      border-bottom: 3px dashed #000000;
      padding: 10px 0;
      font-size: 1.1rem;
      text-align: left;
      line-height: 1.6;
    }

    .sleep-counter {
      font-family: monospace;
      font-size: 1.05rem;
      font-weight: bold;
      margin-top: 12px;
    }

    .flash-invert {
      -webkit-filter: invert(100%);
      filter: invert(100%);
    }
  </style>
</head>
<body>

  <!-- Viewport Stage Container to isolate scroll footprint -->
  <div id="viewport-stage">
    <!-- Screen Rotator Container -->
    <div id="screen-rotator">

      <!-- PC Sleep Fullscreen Overlay -->
      <div id="sleep-overlay">
        <div class="sleep-box">
          <div class="sleep-icon">☾ Z z z</div>
          <div class="sleep-title">PC スリープ中</div>
          <div class="sleep-sub">ホストPCとの通信が途絶えました</div>
          <div class="sleep-details">
            <div>最終通信: <strong id="sleep-last-seen">--:--:--</strong></div>
            <div>スリープ経過: <strong id="sleep-elapsed">0秒</strong></div>
            <div>端末時計: <strong id="sleep-local-clock">--:--:--</strong></div>
          </div>
          <div class="sleep-counter" id="sleep-status-text">
            再接続待機中... (試行 #<span id="sleep-retry-count">0</span>)
          </div>
        </div>
      </div>

      <!-- 3-Column x 2-Row Bold Dashboard Table -->
      <table id="tiles-table" cellpadding="0" cellspacing="8">
        <!-- Row 1 -->
        <tr>
          <!-- Cell 0: CPU -->
          <td class="tile-cell" id="cell-0">
            <div class="tile-box" id="tile-cpu">
              <div class="tile-top">
                <span class="tile-title">CPU</span>
                <span class="tile-tag"><span class="tile-badge" id="val-cpu-cores">--C</span></span>
              </div>
              <div class="tile-mid">
                <div class="tile-num-wrap">
                  <span class="tile-num" id="val-cpu-num">0</span><span class="tile-pct">%</span>
                </div>
                <div class="tile-sub-stat">
                  LOAD
                </div>
              </div>
              <div class="hist-container" id="hist-cpu">
                <!-- 20 columns generated by JS -->
              </div>
            </div>
          </td>

          <!-- Cell 1: GPU -->
          <td class="tile-cell" id="cell-1">
            <div class="tile-box" id="tile-gpu">
              <div class="tile-top">
                <span class="tile-title">GPU</span>
                <span class="tile-tag"><span class="tile-badge" id="val-gpu-badge">GPU</span></span>
              </div>
              <div class="tile-mid">
                <div class="tile-num-wrap">
                  <span class="tile-num" id="val-gpu-num">0</span><span class="tile-pct">%</span>
                </div>
                <div class="tile-sub-stat">
                  <div><strong id="val-gpu-vram">0</strong>G VRAM</div>
                  <div id="val-gpu-temp">--°C</div>
                </div>
              </div>
              <div class="hist-container" id="hist-gpu">
                <!-- 20 columns generated by JS -->
              </div>
            </div>
          </td>

          <!-- Cell 2: RAM -->
          <td class="tile-cell" id="cell-2">
            <div class="tile-box" id="tile-mem">
              <div class="tile-top">
                <span class="tile-title">RAM</span>
                <span class="tile-tag"><span class="tile-badge" id="val-mem-total-badge">--G</span></span>
              </div>
              <div class="tile-mid">
                <div class="tile-num-wrap">
                  <span class="tile-num" id="val-mem-num">0</span><span class="tile-pct">%</span>
                </div>
                <div class="tile-sub-stat">
                  <div>USED: <strong id="val-mem-used">0</strong>G</div>
                  <div>FREE: <strong id="val-mem-free">0</strong>G</div>
                </div>
              </div>
              <div class="hist-container" id="hist-mem">
                <!-- 20 columns generated by JS -->
              </div>
            </div>
          </td>
        </tr>

        <!-- Row 2 -->
        <tr>
          <!-- Cell 3: NETWORK -->
          <td class="tile-cell" id="cell-3">
            <div class="tile-box" id="tile-net">
              <div class="tile-top">
                <span class="tile-title">NETWORK</span>
                <span class="tile-tag"><span class="tile-badge">LAN</span></span>
              </div>
              <div class="tile-mid" style="margin: 6px 0;">
                <div style="width: 100%;">
                  <div style="font-size: 1.85rem; font-weight: 900; margin-bottom: 4px;">
                    ↓ <span id="val-net-in">0.0</span> <span style="font-size: 1.1rem;" id="val-net-in-unit">KB/s</span>
                  </div>
                  <div style="font-size: 1.85rem; font-weight: 900;">
                    ↑ <span id="val-net-out">0.0</span> <span style="font-size: 1.1rem;" id="val-net-out-unit">KB/s</span>
                  </div>
                </div>
              </div>
              <div class="hist-container" id="hist-net">
                <!-- 20 columns generated by JS -->
              </div>
            </div>
          </td>

          <!-- Cell 4: DISKS (All Non-Removable Drives) -->
          <td class="tile-cell" id="cell-4">
            <div class="tile-box" id="tile-disks">
              <div class="tile-top">
                <span class="tile-title">STORAGE</span>
                <span class="tile-tag"><span class="tile-badge" id="val-disk-count">DRIVES</span></span>
              </div>
              <div id="disks-container" style="overflow: hidden; padding-top: 4px;">
                <!-- Drive rows generated dynamically by JS -->
              </div>
            </div>
          </td>

          <!-- Cell 5: ROTATE / SYSTEM STATUS -->
          <td class="tile-cell" id="cell-5">
            <div class="tile-box tile-action" id="tile-rotate" onclick="cycleRotation()">
              <div class="tile-top">
                <span class="tile-title">SYSTEM</span>
                <span class="tile-tag"><span class="tile-badge">● ONLINE</span></span>
              </div>
              <div style="text-align: center; margin: 4px 0;">
                <div class="tile-action-icon">⟳</div>
                <div class="tile-action-label" id="val-rot-label">90° 画面回転</div>
                <div class="tile-action-sub" id="val-hostname">PC</div>
                <div class="tile-action-sub" style="font-family: monospace; font-size: 0.95rem;" id="val-ip">--</div>
              </div>
              <div style="border-top: 3px solid #000; padding-top: 6px; text-align: center;">
                <button class="adj-btn" onclick="testSleepMode(); event.stopPropagation();">☾ 休止テスト</button>
              </div>
            </div>
          </td>
        </tr>
      </table>

    </div>
  </div>

  <script>
    var consecutiveFailures = 0;
    var failureThreshold = 2;
    var isSleeping = false;
    var lastSuccessTime = null;
    var sleepStartTime = null;
    var retryCount = 0;
    var pollIntervalMs = 8000;
    var currentRotation = '90';

    // Width offset deduction from height: 1268 - 42 = 1226px (optimal view)
    var customWidthOffset = 42;

    // Auto-Reload mechanism: server instance ID
    var serverInstanceId = null;

    // Shuffle Burn-in prevention
    var pollCycleCount = 0;
    var shuffleIntervalCycles = 75; // 75 cycles * 8s = 10 minutes

    function padZero(num) {
      return (num < 10 ? '0' : '') + num;
    }

    function formatTime(d) {
      return padZero(d.getHours()) + ':' + padZero(d.getMinutes()) + ':' + padZero(d.getSeconds());
    }

    function formatElapsed(seconds) {
      if (seconds < 60) return Math.floor(seconds) + '秒';
      var minutes = Math.floor(seconds / 60);
      var remSec = Math.floor(seconds % 60);
      if (minutes < 60) return minutes + '分 ' + remSec + '秒';
      var hours = Math.floor(minutes / 60);
      var remMin = minutes % 60;
      return hours + '時間 ' + remMin + '分';
    }

    // Build 20 columns for history containers
    function initHistoryBars(containerId) {
      var container = document.getElementById(containerId);
      if (!container) return;
      var html = '';
      for (var i = 0; i < 20; i++) {
        html += '<div class="hist-col"><div class="hist-bar"></div></div>';
      }
      container.innerHTML = html;
    }

    initHistoryBars('hist-cpu');
    initHistoryBars('hist-gpu');
    initHistoryBars('hist-mem');
    initHistoryBars('hist-net');

    function updateHistoryChart(containerId, dataArray, maxVal) {
      var container = document.getElementById(containerId);
      if (!container) return;
      var bars = container.getElementsByClassName('hist-bar');
      if (!bars || bars.length === 0) return;

      var max = maxVal;
      if (!max || max <= 0) {
        max = 1;
        if (dataArray && dataArray.length > 0) {
          for (var k = 0; k < dataArray.length; k++) {
            if (dataArray[k] > max) max = dataArray[k];
          }
        }
      }

      var len = bars.length;
      var dataLen = dataArray ? dataArray.length : 0;
      for (var i = 0; i < len; i++) {
        var dataIdx = dataLen - len + i;
        var val = (dataIdx >= 0 && dataIdx < dataLen) ? dataArray[dataIdx] : 0;
        var pct = Math.min(100, Math.max(3, Math.round((val / max) * 100)));
        bars[i].style.height = pct + '%';
      }
    }

    function formatSpeed(kb) {
      if (kb >= 1024) {
        return { val: (kb / 1024).toFixed(1), unit: 'MB/s' };
      }
      return { val: Math.round(kb), unit: 'KB/s' };
    }

    function renderStatus(data) {
      // 1. CPU
      var cpuPct = Math.round(data.cpu_usage || 0);
      document.getElementById('val-cpu-num').innerText = cpuPct;
      document.getElementById('val-cpu-cores').innerText = (data.cpu_cores || 0) + 'C';
      updateHistoryChart('hist-cpu', data.cpu_history, 100);

      // 2. GPU
      var gpuPct = Math.round(data.gpu_usage || 0);
      document.getElementById('val-gpu-num').innerText = gpuPct;
      document.getElementById('val-gpu-vram').innerText = (data.vram_used_gb || 0).toFixed(1);
      document.getElementById('val-gpu-temp').innerText = (data.gpu_temp ? data.gpu_temp + '°C' : '');
      var gpuShort = (data.gpu_name || 'GPU').replace('NVIDIA GeForce ', '').replace('NVIDIA ', '');
      document.getElementById('val-gpu-badge').innerText = gpuShort;
      updateHistoryChart('hist-gpu', data.gpu_history, 100);

      // 3. RAM
      var memPct = Math.round(data.mem_percent || 0);
      document.getElementById('val-mem-num').innerText = memPct;
      document.getElementById('val-mem-used').innerText = Math.round(data.mem_used_gb || 0);
      var totalMem = Math.round(data.mem_total_gb || 0);
      var freeMem = Math.max(0, totalMem - Math.round(data.mem_used_gb || 0));
      document.getElementById('val-mem-free').innerText = freeMem;
      document.getElementById('val-mem-total-badge').innerText = totalMem + 'G';
      updateHistoryChart('hist-mem', data.mem_history, 100);

      // 4. Network
      var inSpeed = formatSpeed(data.net_in_kb || 0);
      var outSpeed = formatSpeed(data.net_out_kb || 0);
      document.getElementById('val-net-in').innerText = inSpeed.val;
      document.getElementById('val-net-in-unit').innerText = inSpeed.unit;
      document.getElementById('val-net-out').innerText = outSpeed.val;
      document.getElementById('val-net-out-unit').innerText = outSpeed.unit;

      // Combine in/out history for chart
      var netHistory = [];
      if (data.net_in_history && data.net_out_history) {
        var nLen = Math.max(data.net_in_history.length, data.net_out_history.length);
        for (var ni = 0; ni < nLen; ni++) {
          var rx = data.net_in_history[ni] || 0;
          var tx = data.net_out_history[ni] || 0;
          netHistory.push(rx + tx);
        }
      }
      updateHistoryChart('hist-net', netHistory, 0);

      // 5. Disks (All Non-Removable Drives)
      if (data.disks && data.disks.length > 0) {
        document.getElementById('val-disk-count').innerText = data.disks.length + ' DRIVES';
        var dHtml = '';
        for (var di = 0; di < data.disks.length; di++) {
          var d = data.disks[di];
          var pct = Math.round(d.usage_percent || 0);
          var freeGb = Math.round(d.free_gb || 0);
          var dLetter = d.name.replace(/\\/g, '');
          dHtml += '<div class="disk-row">'
            + '<div class="disk-header">'
            + '  <span class="disk-name">' + dLetter + '</span>'
            + '  <span class="disk-meta"><strong>' + pct + '%</strong> (' + freeGb + 'G 空き)</span>'
            + '</div>'
            + '<div class="disk-track">'
            + '  <div class="disk-fill" style="width: ' + pct + '%;"></div>'
            + '</div>'
            + '</div>';
        }
        document.getElementById('disks-container').innerHTML = dHtml;
      }

      // 6. System / Host
      document.getElementById('val-hostname').innerText = data.hostname || 'PC';
      if (data.server_ip && data.server_port) {
        document.getElementById('val-ip').innerText = data.server_ip + ':' + data.server_port;
      }
    }

    function enterSleepMode() {
      if (isSleeping) return;
      isSleeping = true;
      sleepStartTime = new Date();

      var sleepOverlay = document.getElementById('sleep-overlay');
      if (sleepOverlay) {
        sleepOverlay.style.display = 'block';
      }

      if (lastSuccessTime) {
        document.getElementById('sleep-last-seen').innerText = formatTime(lastSuccessTime);
      } else {
        document.getElementById('sleep-last-seen').innerText = '未接続';
      }

      updateSleepStatus();
      clearGhosting();
    }

    function exitSleepMode() {
      if (!isSleeping) return;
      isSleeping = false;
      sleepStartTime = null;
      retryCount = 0;

      var sleepOverlay = document.getElementById('sleep-overlay');
      if (sleepOverlay) {
        sleepOverlay.style.display = 'none';
      }

      clearGhosting();
    }

    function testSleepMode() {
      enterSleepMode();
      setTimeout(function() {
        exitSleepMode();
      }, 15000);
    }

    function updateSleepStatus() {
      if (!isSleeping) return;
      var now = new Date();
      document.getElementById('sleep-local-clock').innerText = formatTime(now);
      if (sleepStartTime) {
        var elapsedSec = (now.getTime() - sleepStartTime.getTime()) / 1000;
        document.getElementById('sleep-elapsed').innerText = formatElapsed(elapsedSec);
      }
      document.getElementById('sleep-retry-count').innerText = retryCount;
    }

    function pollStatus() {
      if (isSleeping) {
        retryCount++;
        updateSleepStatus();
      }

      var winW = window.innerWidth || 0;
      var winH = window.innerHeight || 0;
      var docW = document.documentElement ? document.documentElement.clientWidth : 0;
      var docH = document.documentElement ? document.documentElement.clientHeight : 0;
      var scrW = document.documentElement ? document.documentElement.scrollWidth : 0;
      var scrH = document.documentElement ? document.documentElement.scrollHeight : 0;
      var sTop = window.pageYOffset || (document.documentElement ? document.documentElement.scrollTop : 0) || (document.body ? document.body.scrollTop : 0) || 0;
      var sLeft = window.pageXOffset || (document.documentElement ? document.documentElement.scrollLeft : 0) || (document.body ? document.body.scrollLeft : 0) || 0;

      var telemetry = '&winW=' + winW + '&winH=' + winH
        + '&docW=' + docW + '&docH=' + docH
        + '&scrW=' + scrW + '&scrH=' + scrH
        + '&sTop=' + sTop + '&sLeft=' + sLeft
        + '&rot=' + currentRotation;

      var xhr = new XMLHttpRequest();
      xhr.open('GET', '/api/status?nocache=' + new Date().getTime() + telemetry, true);

      var reqFinished = false;
      var timer = setTimeout(function() {
        if (!reqFinished) {
          reqFinished = true;
          try { xhr.abort(); } catch(e) {}
          handleFailure();
        }
      }, 4000);

      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (reqFinished) return;
          reqFinished = true;
          clearTimeout(timer);

          if (xhr.status >= 200 && xhr.status < 300) {
            try {
              var data = JSON.parse(xhr.responseText);

              if (data.server_instance) {
                if (serverInstanceId === null) {
                  serverInstanceId = data.server_instance;
                } else if (serverInstanceId !== data.server_instance) {
                  window.location.href = window.location.pathname + '?r=' + new Date().getTime();
                  return;
                }
              }

              consecutiveFailures = 0;
              lastSuccessTime = new Date();

              if (isSleeping) {
                exitSleepMode();
              }

              renderStatus(data);

              pollCycleCount++;
              if (pollCycleCount >= shuffleIntervalCycles) {
                pollCycleCount = 0;
                shuffleTiles();
              }

            } catch (e) {
              handleFailure();
            }
          } else {
            handleFailure();
          }
        }
      };

      try {
        xhr.send();
      } catch(e) {
        if (!reqFinished) {
          reqFinished = true;
          clearTimeout(timer);
          handleFailure();
        }
      }
    }

    function handleFailure() {
      consecutiveFailures++;
      if (consecutiveFailures >= failureThreshold) {
        enterSleepMode();
      }
    }

    function shuffleTiles() {
      var cells = [];
      for (var i = 0; i < 6; i++) {
        var cell = document.getElementById('cell-' + i);
        if (cell && cell.firstElementChild) {
          cells.push(cell.firstElementChild);
        }
      }

      for (var j = cells.length - 1; j > 0; j--) {
        var k = Math.floor(Math.random() * (j + 1));
        var temp = cells[j];
        cells[j] = cells[k];
        cells[k] = temp;
      }

      for (var m = 0; m < 6; m++) {
        var targetCell = document.getElementById('cell-' + m);
        if (targetCell && cells[m]) {
          targetCell.appendChild(cells[m]);
        }
      }

      clearGhosting();
    }

    function getViewportDimensions() {
      var w = window.innerWidth || (document.documentElement ? document.documentElement.clientWidth : 0) || 1072;
      var h = window.innerHeight || (document.documentElement ? document.documentElement.clientHeight : 0) || 1260;
      if (h >= 1400) {
        h = 1260;
      }
      return { w: w, h: h };
    }

    /* Apply rotation with exact pixel clamp on root elements */
    function applyRotation() {
      var rotator = document.getElementById('screen-rotator');
      var stage = document.getElementById('viewport-stage');
      if (!rotator || !stage) return;

      var dims = getViewportDimensions();
      var w = dims.w;
      var h = dims.h;

      // Lock documentElement strictly to real viewport
      document.documentElement.style.width = w + 'px';
      document.documentElement.style.height = h + 'px';

      // Push body width by +40px to cast the native right-edge scrollbar off the screen
      document.body.style.width = (w + 40) + 'px';
      document.body.style.height = h + 'px';

      // Stage remains locked to the exact visible viewport (w x h)
      stage.style.width = w + 'px';
      stage.style.height = h + 'px';

      var safeLandscapeW = Math.max(100, h - customWidthOffset);
      var safeLandscapeH = Math.max(100, w - 8);

      rotator.style.position = 'absolute';
      rotator.style.left = '0px';
      rotator.style.top = '0px';
      rotator.style.width = safeLandscapeW + 'px';
      rotator.style.height = safeLandscapeH + 'px';
      rotator.style.webkitTransformOrigin = '0 0';
      rotator.style.transformOrigin = '0 0';

      if (currentRotation === '90') {
        var transformStr = 'translate(' + safeLandscapeH + 'px, 0px) rotate(90deg)';
        rotator.style.webkitTransform = transformStr;
        rotator.style.transform = transformStr;
        document.getElementById('val-rot-label').innerText = '90° 画面回転';
      } else if (currentRotation === '270') {
        var transformStr = 'translate(0px, ' + safeLandscapeW + 'px) rotate(-90deg)';
        rotator.style.webkitTransform = transformStr;
        rotator.style.transform = transformStr;
        document.getElementById('val-rot-label').innerText = '270° 画面回転';
      } else {
        // '0' (Portrait)
        rotator.style.width = (w - 8) + 'px';
        rotator.style.height = (h - 8) + 'px';
        rotator.style.left = '4px';
        rotator.style.top = '4px';
        rotator.style.webkitTransform = 'none';
        rotator.style.transform = 'none';
        document.getElementById('val-rot-label').innerText = '0° 画面回転';
      }

      window.scrollTo(0, 0);
    }

    function setRotation(rot) {
      currentRotation = rot;
      applyRotation();
      try {
        localStorage.setItem('kindle_monitor_rot', rot);
      } catch (e) {}
      clearGhosting();
    }

    function cycleRotation() {
      if (currentRotation === '90') {
        setRotation('270');
      } else if (currentRotation === '270') {
        setRotation('0');
      } else {
        setRotation('90');
      }
    }

    window.addEventListener('resize', applyRotation);

    try {
      document.addEventListener('touchmove', function(e) {
        if (e.preventDefault) e.preventDefault();
      }, false);
    } catch (e) {}

    function clearGhosting() {
      document.body.className = 'flash-invert';
      setTimeout(function() {
        document.body.className = '';
      }, 150);
    }

    try {
      var savedRot = localStorage.getItem('kindle_monitor_rot');
      if (savedRot) {
        currentRotation = savedRot;
      }
    } catch (e) {}

    applyRotation();
    pollStatus();
    setInterval(pollStatus, pollIntervalMs);

    setInterval(function() {
      if (isSleeping) updateSleepStatus();
    }, 1000);
  </script>
</body>
</html>
